spring:
  datasource:
    url: jdbc:h2:mem:pgds;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
pgds:
  seed-demo-data: true
  ai:
    schedule-enabled: false
    demo-endpoint-enabled: true
